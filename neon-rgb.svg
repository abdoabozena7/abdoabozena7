<!-- neon-rgb.svg -->
<svg width="1200" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abdelrahman Abozena">
  <defs>
    <!-- شريط RGB يتحرك (بديل CSS gradient animation) -->
    <linearGradient id="rgb" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%"   stop-color="#ff0055"/>
      <stop offset="25%"  stop-color="#ffd319"/>
      <stop offset="50%"  stop-color="#00ffa3"/>
      <stop offset="75%"  stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
      <animate attributeName="x1" values="0%;-100%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <!-- جلو نيون -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- نفس فكرة المرجع: كتابة مرسومة بالـstroke ثم تختفي بالعكس -->
    <style>
      .handwritten {
        fill: url(#rgb);
        fill-opacity: 0;
        stroke: url(#rgb);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation: handwrite 7s ease-in-out infinite alternate;
      }

      @keyframes handwrite {
        0%, 8% {
          fill-opacity: 0;
          opacity: 0.45;
          stroke-dashoffset: 1;
        }
        58%, 100% {
          fill-opacity: 0.96;
          opacity: 1;
          stroke-dashoffset: 0;
        }
      }
    </style>
  </defs>

