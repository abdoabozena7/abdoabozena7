name: Regenerate portfolio preview

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  push:
    paths:
      - "scripts/capture-portfolio.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/portfolio-preview.yml"

permissions:
  contents: write

concurrency:
  group: portfolio-preview
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install capture dependencies
        run: npm ci

      - name: Install Chromium with WebGL dependencies
        run: npx playwright install --with-deps chromium

      - name: Capture and optimize live portfolio
        run: npm run capture:portfolio

      - name: Publish the new preview without touching the snake branch
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "chore: refresh portfolio preview"
          file_pattern: assets/portfolio-preview/portfolio-preview.webp
